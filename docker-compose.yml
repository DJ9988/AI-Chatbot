# Indian Unicorn Startups AI Chatbot Application Stack
# Run: docker compose up -d --build
# API Endpoints: http://localhost:8000
# Interactive Swagger Docs: http://localhost:8000/docs
#
# Observability Note:
# - If using Langfuse Cloud: Set LANGFUSE_HOST=https://cloud.langfuse.com in .env
# - If using local Langfuse: Set LANGFUSE_HOST=http://host.docker.internal:3000 in .env
#   (Start local Langfuse via: sudo docker compose -f deploy/docker-compose.langfuse.yml up -d)

services:
  chatbot-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: indian-unicorns-chatbot-api:latest
    container_name: chatbot-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./data/processed:/app/data/processed:ro
    extra_hosts:
      # Enables container on Linux to reach local Langfuse on host via host.docker.internal
      - "host.docker.internal:host-gateway"
